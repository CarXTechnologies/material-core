schema_version = "1.0.0"
id = "rtc_material_browser"
version = "1.0.2"
name = "Material Core"
tagline = "Browse SVN textures and apply RenderCore materials"
maintainer = "RTC Tools"
type = "add-on"
blender_version_min = "5.0.0"
license = ["SPDX:GPL-3.0-or-later"]
platforms = ["windows-x64"]
wheels = ["./wheels/pillow-12.3.0-cp311-cp311-win_amd64.whl"]

[permissions]
files = "Read SVN textures and store the catalog and previews"
network = "Read SVN history and download the SVN client when needed"

[build]
paths_exclude_pattern = ["__pycache__/", "*.pyc", "*.blend1"]
